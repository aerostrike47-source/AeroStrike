<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroStrike - Sklep</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1015;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
        }

        /* Lewy panel z logo - zwiększono szerokość i max rozmiar logo */
        .sidebar {
            width: 320px;
            background-color: #161822;
            padding: 40px 20px;
            border-right: 2px solid #e50914;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 100%;
            max-width: 240px; /* Powiększone logo */
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 0px 10px rgba(229, 9, 20, 0.4));
        }

        /* Prawa strona z zawartością */
        .main-content {
            margin-left: 320px;
            flex: 1;
            padding: 50px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 36px; /* Większy nagłówek */
            margin-bottom: 35px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #2a2e3d;
            padding-bottom: 15px;
            color: #ffffff;
        }

        /* Karta produktu - ZWIĘKSZONA (z 450px do 750px) */
        .product-card {
            background: #181a24;
            border: 2px solid #2a2e3d;
            border-radius: 16px;
            max-width: 750px; /* Zwiększona szerokość karty */
            padding: 35px; /* Większy odstęp wewnątrz */
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #e50914;
        }

        .product-title {
            font-size: 30px; /* Większy tytuł produktu */
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffffff;
        }

        /* Większa grafika podkładki */
        .product-image {
            width: 100%;
            max-height: 450px; /* Zwiększona wysokość obrazka */
            height: auto;
            border-radius: 12px;
            margin-bottom: 25px;
            display: block;
            object-fit: cover;
        }

        .price-tag {
            font-size: 36px; /* Większy napis ceny */
            font-weight: bold;
            color: #e50914;
            margin-bottom: 25px;
        }

        /* Większy przycisk Kup Teraz */
        .buy-btn {
            display: block;
            width: 100%;
            padding: 20px; /* Wyższy przycisk */
            background-color: #e50914;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px; /* Większy tekst na przycisku */
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .buy-btn:hover {
            background-color: #ff0f1f;
            box-shadow: 0 0 20px rgba(229, 9, 20, 0.7);
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                position: relative;
                width: 100%;
                border-right: none;
                border-bottom: 2px solid #e50914;
                padding: 25px;
            }
            .main-content {
                margin-left: 0;
                padding: 25px;
            }
            .product-card {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- LEWA STRONA: LOGO -->
    <a href="https://imgbb.com/">
        <img src="https://i.ibb.co/fdLvkdrh/logo-aerostrike.png" alt="logo aerostrike" border="0">
    </a>

    <!-- PRAWA STRONA: PRODUKTY -->
    <div class="main-content">
        <h1 class="section-title">Nasze Produkty</h1>

        <!-- PRZEDMIOT 1: PODKŁADKA -->
        <div class="product-card">
            <h2 class="product-title">Podkładka AeroStrike eagle</h2>
            
            <img src="image_d797a2.jpg" alt="Podkładka AeroStrike" class="product-image">
            
            <div class="price-tag">65 zł</div>
            
            <!-- TUTAJ WKLEJ SWÓJ LINK -->
            <a href="https://twoj-link-do-zakupu.pl" target="_blank" class="buy-btn">KUP TERAZ</a>
        </div>
    </div>

</body>
</html>
