<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroStrike - Sklep</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f1015;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
        }

        /* Lewy panel z logo */
        .sidebar {
            width: 280px;
            background-color: #161822;
            padding: 30px 20px;
            border-right: 2px solid #e50914;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 100%;
            max-width: 180px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0px 0px 8px rgba(229, 9, 20, 0.4));
        }

        /* Prawa strona z zawartością i możliwością skrolowania */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #2a2e3d;
            padding-bottom: 10px;
            color: #ffffff;
        }

        /* Karta produktu */
        .product-card {
            background: #181a24;
            border: 1px solid #2a2e3d;
            border-radius: 12px;
            max-width: 450px;
            padding: 24px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: #e50914;
        }

        .product-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .product-image {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
            display: block;
            object-fit: cover;
        }

        .price-tag {
            font-size: 26px;
            font-weight: bold;
            color: #e50914;
            margin-bottom: 20px;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #e50914;
            color: #ffffff;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .buy-btn:hover {
            background-color: #ff0f1f;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.6);
        }

        /* RWD - Dostosowanie na telefony */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                position: relative;
                width: 100%;
                border-right: none;
                border-bottom: 2px solid #e50914;
                padding: 20px;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- LEWA STRONA: LOGO -->
    <div class="sidebar">
        <img src="logo-aerostrike.png" alt="AeroStrike Logo" class="logo">
    </div>

    <!-- PRAWA STRONA: PRODUKTY -->
    <div class="main-content">
        <h1 class="section-title">Nasze Produkty</h1>

       <!-- PRZEDMIOT 1: PODKŁADKA -->
        <div class="product-card">
            <h2 class="product-title">Podkładka Gamingowa AeroStrike</h2>
            
            <img src="https://i.postimg.cc/tCzRnB78/Zrzut-ekranu-2026-10-23-191712.png" alt="Podkładka AeroStrike" class="product-image">
            
            <div class="price-tag">65 zł</div>
    
    <a href="https://www.vinted.pl/member/284983221" target="_blank" class="buy-btn">KUP TERAZ</a>
</div>
