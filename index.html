<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroStrike | Gaming Showcase & Bio Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 34, 0.8);
            --accent-purple: #8a2be2;
            --accent-cyan: #00f3ff;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(45deg, #fff, var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        p.bio {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 20px;
            border-radius: 12px;
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .link-btn:hover {
            background: rgba(0, 243, 255, 0.1);
            border-color: var(--accent-cyan);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 243, 255, 0.2);
        }

        .link-btn i {
            font-size: 20px;
        }

        .section-title {
            font-size: 18px;
            text-align: left;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            color: var(--accent-cyan);
        }

        .gear-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .gear-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: left;
        }

        .gear-card span {
            display: block;
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .gear-card strong {
            font-size: 13px;
            color: var(--text-main);
        }

        footer {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-container">
            <div class="avatar">
                <i class="fa-solid fa-gamepad"></i>
            </div>
        </div>

        <h1>AeroStrike</h1>
        <p class="bio">Gamer | Streamer | Content Creator</p>

        <div class="links">
            <a href="https://twitch.tv" target="_blank" class="link-btn">
                <i class="fa-brands fa-twitch" style="color: #9146FF;"></i>
                <span>Twitch</span>
                <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 12px; opacity: 0.5;"></i>
            </a>

            <a href="https://youtube.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-youtube" style="color: #FF0000;"></i>
                <span>YouTube</span>
                <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 12px; opacity: 0.5;"></i>
            </a>

            <a href="https://tiktok.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-tiktok"></i>
                <span>TikTok</span>
                <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 12px; opacity: 0.5;"></i>
            </a>

            <a href="https://discord.com" target="_blank" class="link-btn">
                <i class="fa-brands fa-discord" style="color: #5865F2;"></i>
                <span>Discord Server</span>
                <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 12px; opacity: 0.5;"></i>
            </a>
        </div>

        <div class="section-title"><i class="fa-solid fa-desktop"></i> Mój Sprzęt (Setup)</div>

        <div class="gear-grid">
            <div class="gear-card">
                <span>Myszka</span>
                <strong>Logitech G Pro X Superlight</strong>
            </div>
            <div class="gear-card">
                <span>Klawiatura</span>
                <strong>Custom Mechanical Keyboard</strong>
            </div>
            <div class="gear-card">
                <span>Słuchawki</span>
                <strong>HyperX Cloud II</strong>
            </div>
            <div class="gear-card">
                <span>Monitor</span>
                <strong>244Hz Gaming Monitor</strong>
            </div>
        </div>

        <footer>
            © 2026 AeroStrike. All rights reserved.
        </footer>
    </div>

</body>
</html>
